<div class="shell">
  <header class="shell__header" role="banner">
    <nav class="shell__nav" aria-label="Main navigation">
      <a routerLink="/teams" class="shell__logo" aria-label="TaskForge home">
        <span class="shell__logo-icon" aria-hidden="true">⚡</span>
        <span class="shell__logo-text">TaskForge</span>
      </a>

      <div class="shell__nav-links">
        <a
          routerLink="/teams"
          routerLinkActive="shell__nav-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="shell__nav-link"
        >
          Teams
        </a>
        <a
          routerLink="/dashboard"
          routerLinkActive="shell__nav-link--active"
          class="shell__nav-link"
        >
          My Tasks
        </a>
      </div>
    </nav>

    <div class="shell__user">
      @if (authStore.user(); as user) {
        <button
          tuiButton
          appearance="ghost"
          size="s"
          type="button"
          class="shell__user-btn"
          [tuiDropdown]="userMenu"
          [(tuiDropdownOpen)]="menuOpen"
          aria-label="User menu"
          [attr.aria-expanded]="menuOpen()"
        >
          <span class="shell__avatar" aria-hidden="true">{{ userInitials }}</span>
          <span class="shell__user-name">{{ user.name }}</span>
          <tui-icon icon="@tui.chevron-down" class="shell__chevron" />
        </button>

        <ng-template #userMenu>
          <tui-data-list role="menu" aria-label="User options">
            <p class="shell__menu-email">{{ user.email }}</p>
            <hr class="shell__menu-divider" />
            <button tuiOption type="button" role="menuitem" (click)="logout()">
              Sign out
            </button>
          </tui-data-list>
        </ng-template>
      }
    </div>
  </header>

  <main class="shell__content" role="main">
    <router-outlet />
  </main>
</div>

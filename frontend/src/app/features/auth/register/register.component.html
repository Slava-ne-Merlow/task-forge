<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <h1 class="auth-card__title">TaskForge</h1>
      <p class="auth-card__subtitle">Create your account</p>
    </div>

    @if (authStore.error()) {
      <div class="auth-card__error" role="alert">
        {{ authStore.error() }}
      </div>
    }

    <form class="auth-card__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <tui-textfield>
        <label tuiLabel for="reg-name">Full name</label>
        <input
          id="reg-name"
          tuiInput
          type="text"
          formControlName="name"
          autocomplete="name"
          placeholder="John Doe"
        />
        <tui-error formControlName="name" [order]="['required', 'minlength']" />
      </tui-textfield>

      <tui-textfield>
        <label tuiLabel for="reg-email">Email</label>
        <input
          id="reg-email"
          tuiInput
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
        />
        <tui-error formControlName="email" [order]="['required', 'email']" />
      </tui-textfield>

      <tui-textfield>
        <label tuiLabel for="reg-password">Password</label>
        <input
          id="reg-password"
          tuiInput
          type="password"
          formControlName="password"
          autocomplete="new-password"
          placeholder="Min. 6 characters"
        />
        <tui-error formControlName="password" [order]="['required', 'minlength']" />
      </tui-textfield>

      <tui-textfield>
        <label tuiLabel for="reg-confirm">Confirm password</label>
        <input
          id="reg-confirm"
          tuiInput
          type="password"
          formControlName="confirmPassword"
          autocomplete="new-password"
          placeholder="Repeat password"
        />
        @if (passwordMismatch) {
          <tui-error error="Passwords do not match" />
        } @else {
          <tui-error formControlName="confirmPassword" [order]="['required']" />
        }
      </tui-textfield>

      <button
        tuiButton
        type="submit"
        appearance="primary"
        size="l"
        class="auth-card__submit"
        [loading]="authStore.loading()"
      >
        Create account
      </button>
    </form>

    <p class="auth-card__footer">
      Already have an account?
      <a routerLink="/auth/login">Sign in</a>
    </p>
  </div>
</div>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <h1 class="auth-card__title">TaskForge</h1>
      <p class="auth-card__subtitle">Sign in to your account</p>
    </div>

    @if (authStore.error()) {
      <div class="auth-card__error" role="alert">
        {{ authStore.error() }}
      </div>
    }

    <form class="auth-card__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <tui-textfield>
        <label tuiLabel for="login-email">Email</label>
        <input
          id="login-email"
          tuiInput
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
        />
        <tui-error formControlName="email" [order]="['required', 'email']" />
      </tui-textfield>

      <tui-textfield>
        <label tuiLabel for="login-password">Password</label>
        <input
          id="login-password"
          tuiInput
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••"
        />
        <tui-error formControlName="password" [order]="['required', 'minlength']" />
      </tui-textfield>

      <button
        tuiButton
        type="submit"
        appearance="primary"
        size="l"
        class="auth-card__submit"
        [loading]="authStore.loading()"
      >
        Sign In
      </button>
    </form>

    <!-- Test accounts quick-select -->
    <div class="test-accounts">
      <p class="test-accounts__label">Тестовые аккаунты</p>
      <div class="test-accounts__grid">
        @for (acc of testAccounts; track acc.email) {
          <button
            type="button"
            class="test-account"
            [class.test-account--active]="form.get('email')!.value === acc.email"
            (click)="fillAccount(acc)"
            [attr.aria-label]="'Войти как ' + acc.name"
          >
            <span class="test-account__avatar">{{ acc.name.charAt(0) }}</span>
            <span class="test-account__info">
              <span class="test-account__name">{{ acc.name }}</span>
              <span class="test-account__team">{{ acc.team }}</span>
            </span>
            <span
              tuiBadge
              [appearance]="roleAppearance(acc.role)"
              size="s"
              class="test-account__badge"
            >{{ acc.role }}</span>
          </button>
        }
      </div>
    </div>

    <p class="auth-card__footer">
      Don't have an account?
      <a routerLink="/auth/register">Create one</a>
    </p>
  </div>
</div>

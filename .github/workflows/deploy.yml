name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run lint:styles

      - name: Prettier check
        run: npm run format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run unit tests
        run: npm run test:ci

  build-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: npx ng build --configuration production

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy backend to VPS
        run: |
          rsync -az --delete \
            --exclude='*.db' \
            --exclude='*.db-journal' \
            --exclude='__pycache__/' \
            --exclude='prod_seed.py' \
            backend/ \
            root@${{ secrets.VPS_HOST }}:/opt/taskforge/backend/

      - name: Copy frontend build to VPS
        run: |
          rsync -az --delete \
            frontend/dist/TaskForge/browser/ \
            root@${{ secrets.VPS_HOST }}:/opt/taskforge/frontend/

      - name: Restart backend & reload nginx
        run: |
          ssh root@${{ secrets.VPS_HOST }} \
            "cd /opt/taskforge/backend && \
             /opt/taskforge/venv/bin/pip install -r requirements.txt -q && \
             systemctl restart taskforge-backend && \
             systemctl reload nginx && \
             echo 'Deploy complete'"

      - name: Health check
        run: |
          sleep 5
          curl -f https://${{ secrets.VPS_HOST }}/api/health || \
          curl -f http://${{ secrets.VPS_HOST }}/api/health || exit 1
          echo "✓ Health check passed"

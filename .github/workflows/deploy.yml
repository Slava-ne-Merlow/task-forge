name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: npx ng build --configuration production

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          ssh-keygen -l -f ~/.ssh/deploy_key

      - name: Copy backend to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/ \
            root@${{ secrets.VPS_HOST }}:/opt/taskforge/backend/

      - name: Copy frontend build to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/TaskForge/browser/ \
            root@${{ secrets.VPS_HOST }}:/opt/taskforge/frontend/

      - name: Restart backend service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@${{ secrets.VPS_HOST }} \
            "cd /opt/taskforge/backend && \
             /opt/taskforge/venv/bin/pip install -r requirements.txt -q && \
             systemctl restart taskforge-backend && \
             systemctl reload nginx && \
             echo 'Deploy complete'"

      - name: Health check
        run: |
          sleep 5
          curl -f http://${{ secrets.VPS_HOST }}/api/health || exit 1
          echo "✓ Health check passed"
